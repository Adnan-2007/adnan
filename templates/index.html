<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADNAN | Link in Bio</title>
    <!-- استيراد الفونتات الفخمة -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Grand+Hotel&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        /* خلفية المجرة الواقعية */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: #030000;
            background-image: 
                radial-gradient(circle at center, rgba(140, 0, 0, 0.3) 0%, rgba(10, 0, 0, 0.8) 70%, #000 100%),
                url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?ixlib=rb-1.2.1&auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-blend-mode: multiply;
        }

        body {
            color: #f8fafc;
            font-family: Tahoma, sans-serif;
            text-align: center;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* دخولية مغبشة تعرض الصفحة كاملة مع غباش ثم تختفي بسلاسة */
        #loader-wrapper {
            position: fixed;
            inset: 0;
            background: rgba(3, 0, 0, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 9999;
            opacity: 1;
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), backdrop-filter 1.2s ease;
            pointer-events: auto;
        }

        #loader-wrapper.hidden {
            opacity: 0;
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            pointer-events: none;
            visibility: hidden;
        }

        /* النجوم الواقعية المتساقطة */
        .star {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            animation: fallStars linear infinite;
        }

        @keyframes fallStars {
            0% { transform: translateY(-30px) translateX(0) scale(0.6); opacity: 0; }
            20% { opacity: 0.9; transform: translateY(20vh) translateX(15px) scale(1.2); }
            50% { opacity: 0.4; transform: translateY(50vh) translateX(30px) scale(0.8); }
            80% { opacity: 1; transform: translateY(80vh) translateX(45px) scale(1.1); }
            100% { transform: translateY(105vh) translateX(60px) scale(0.6); opacity: 0; }
        }

        /* محتوى الصفحة الرئيسي */
        #main-content {
            opacity: 1;
            transform: scale(1);
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 400px;
            padding: 40px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-wrapper {
            position: relative;
            margin: 0 auto 20px;
            display: inline-block;
            animation: floatUpDown 3.4s ease-in-out infinite;
        }

        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .profile-wrapper::after {
            content: '';
            position: absolute;
            top: -7px; left: -7px; right: -7px; bottom: -7px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.45), rgba(220, 38, 38, 0.15));
            filter: blur(14px);
            z-index: -1;
            opacity: 0.6;
            animation: pulseRed 3s infinite alternate;
        }

        @keyframes pulseRed {
            0% { transform: scale(0.95); opacity: 0.4; }
            100% { transform: scale(1.03); opacity: 0.7; }
        }

        .profile-img {
            width: 110px; height: 110px;
            background: #111;
            border-radius: 50%;
            border: 3px solid #333;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.9);
            background-image: url('/static/img.jpg');
            background-size: cover;
            background-position: center;
        }

        .crown {
            position: absolute;
            top: -17px; left: 50%;
            transform: translateX(-50%);
            width: 34px; height: 34px;
            z-index: 4;
            filter: drop-shadow(0 2px 6px rgba(220, 38, 38, 0.6));
        }

        h1 { color: #f8fafc; font-size: 28px; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(255,255,255,0.2); }
        p.bio { color: #94a3b8; font-size: 15px; margin-bottom: 30px; font-weight: bold; }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
            align-items: center;
            width: 100%;
        }

        /* الأزرار مع تأثير كبسة عصري وراقي جداً */
        .link-btn {
            position: relative;
            overflow: hidden;
            color: white;
            padding: 18px 10px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 18px;
            width: 100%;
            max-width: 190px;
            text-align: center;
            display: block;
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid rgba(50, 50, 50, 0.5);
            backdrop-filter: blur(5px);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
            animation: floatUpDown 3.4s ease-in-out infinite;
        }

        .link-btn:nth-child(2) { animation-delay: 0.3s; }
        .link-btn:nth-child(3) { animation-delay: 0.6s; }
        .link-btn:nth-child(4) { animation-delay: 0.9s; }
        .link-btn:nth-child(5) { animation-delay: 1.2s; }

        /* تأثير كبسة عصري وناعم */
        .link-btn:active {
            transform: scale(0.92) translateY(2px) !important;
            border-color: rgba(220, 38, 38, 0.7);
            box-shadow: 0 0 20px rgba(220, 38, 38, 0.4);
        }

        .link-btn span {
            position: relative;
            z-index: 3;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.8), 0 0 12px rgba(255, 255, 255, 0.6);
        }

        .btn-galaxy {
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, var(--app-color) 30%, transparent 50%, var(--app-color) 80%, transparent);
            border-radius: 50%;
            filter: blur(25px);
            opacity: 0.4;
            animation: spinGalaxy 8s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes spinGalaxy {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .icon-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.15;
            filter: grayscale(100%) brightness(2);
            pointer-events: none;
        }

        .icon-overlay img, .icon-overlay svg { width: 70%; height: 70%; object-fit: contain; }

        .github-btn { --app-color: #ffffff; box-shadow: 0 0 16px rgba(255, 255, 255, 0.2); }
        .insta-btn { --app-color: #e1306c; box-shadow: 0 0 18px rgba(225, 48, 108, 0.3); }
        .threads-btn { --app-color: #ffffff; box-shadow: 0 0 14px rgba(255, 255, 255, 0.2); }
        .snap-btn { --app-color: #fffc00; box-shadow: 0 0 16px rgba(255, 252, 0, 0.2); }
        .discord-btn { --app-color: #5865f2; box-shadow: 0 0 16px rgba(88, 101, 242, 0.3); }

        .github-font, .discord-font { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
        .insta-font { font-family: 'Grand Hotel', cursive; font-size: 24px; }
        .threads-font, .snap-font { font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: 1px; }

        /* حقوق المطور وتوقيع حرف A بفونت إنستا بدون دائرة */
        .developer-footer {
            margin-top: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }
        .developer-footer:hover { opacity: 1; }
        .developer-footer span { color: #94a3b8; font-size: 14px; font-weight: bold; letter-spacing: 0.5px; }
        .developer-footer img { width: 22px; height: 22px; filter: drop-shadow(0 0 4px rgba(148, 163, 184, 0.4)); }

        .dev-signature {
            font-family: 'Grand Hotel', cursive;
            font-size: 26px;
            color: #dc2626;
            margin-left: 2px;
            text-shadow: 0 0 10px rgba(220, 38, 38, 0.7);
            line-height: 1;
        }
    </style>
</head>
<body>

    <!-- صوت الكبسة العصري والخفيف -->
    <audio id="click-sound" preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" type="audio/mpeg">
    </audio>

    <!-- دخولية مغبشة تعرض الصفحة كاملة مع غباش وتختفي بسلاسة -->
    <div id="loader-wrapper"></div>

    <div id="main-content">
        <div class="profile-wrapper">
            <svg class="crown" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1a1a1a"/>
                        <stop offset="50%" stop-color="#0a0a0a"/>
                        <stop offset="100%" stop-color="#000000"/>
                    </linearGradient>
                </defs>
                <path d="M6 46 L2 20 L18 32 L32 10 L46 32 L62 20 L58 46 Z" fill="url(#crownGrad)" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round"/>
                <rect x="6" y="46" width="52" height="8" rx="2" fill="url(#crownGrad)" stroke="#dc2626" stroke-width="1.6"/>
                <circle cx="32" cy="12" r="3.2" fill="#dc2626"/>

            </svg>
            <div class="profile-img"></div>
        </div>
        <h1>ADNAN</h1>
        <p class="bio">طبعا انا سويته لا داعي للمدح 😻</p>

        <div class="links-container">
            <a href="https://github.com/adnan-2007" target="_blank" class="link-btn github-btn">
                <div class="btn-galaxy"></div>
                <div class="icon-overlay">
                    <svg viewBox="0 0 24 24" fill="#ffffff" xmlns="http://www.w3.org/2000/svg"><path d="M12 .5C5.73.5.98 5.24.98 11.52c0 5.02 3.26 9.28 7.79 10.78.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.1-3.17.69-3.84-1.36-3.84-1.36-.52-1.32-1.27-1.68-1.27-1.68-1.04-.71.08-.69.08-.69 1.15.08 1.75 1.18 1.75 1.18 1.02 1.75 2.68 1.24 3.33.95.1-.74.4-1.24.72-1.53-2.53-.29-5.19-1.27-5.19-5.63 0-1.24.44-2.26 1.17-3.06-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.17a10.9 10.9 0 0 1 5.73 0c2.18-1.48 3.14-1.17 3.14-1.17.63 1.58.24 2.75.12 3.04.73.8 1.16 1.82 1.16 3.06 0 4.37-2.66 5.34-5.2 5.62.41.36.77 1.06.77 2.15 0 1.55-.01 2.8-.01 3.18 0 .3.2.66.79.55A11.03 11.03 0 0 0 23 11.52C23 5.24 18.27.5 12 .5Z"/></svg>
                </div>

            <a href="https://instagram.com/3oam_7" target="_blank" class="link-btn insta-btn">

                    <svg viewBox="0 0 24 24" fill="#ffffff" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.2c3.2 0 3.58.01 4.85.07 1.17.05 1.97.24 2.43.4a4.9 4.9 0 0 1 1.77 1.15 4.9 4.9 0 0 1 1.15 1.77c.16.46.35 1.26.4 2.43.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.24 1.97-.4 2.43a4.94 4.94 0 0 1-1.15 1.77 4.9 4.9 0 0 1-1.77 1.15c-.46.16-1.26.35-2.43.4-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.97-.24-2.43-.4a4.9 4.9 0 0 1-1.77-1.15 4.9 4.9 0 0 1-1.15-1.77c-.16-.46-.35-1.26-.4-2.43C2.21 15.58 2.2 15.2 2.2 12s.01-3.58.07-4.85c.05-1.17.24-1.97.4-2.43a4.9 4.9 0 0 1 1.15-1.77A4.9 4.9 0 0 1 5.59 1.8c.46-.16 1.26-.35 2.43-.4C9.29 1.34 9.67 1.33 12 1.33Zm0 1.98c-3.15 0-3.5.01-4.74.07-.96.04-1.48.2-1.83.34-.46.18-.79.4-1.14.75-.35.35-.57.68-.75 1.14-.14.35-.3.87-.34 1.83-.06 1.24-.07 1.59-.07 4.74s.01 3.5.07 4.74c.04.96.2 1.48.34 1.83.18.46.4.79.75 1.14.35.35.68.57 1.14.75.35.14.87.3 1.83.34 1.24.06 1.59.07 4.74.07s3.5-.01 4.74-.07c.96-.04 1.48-.2 1.83-.34.46-.18.79-.4 1.14-.75.35-.35.57-.68.75-1.14.14-.35.3-.87.34-1.83.06-1.24.07-1.59.07-4.74s-.01-3.5-.07-4.74c-.04-.96-.2-1.48-.34-1.83a3.07 3.07 0 0 0-.75-1.14 3.07 3.07 0 0 0-1.14-.75c-.35-.14-.87-.3-1.83-.34-1.24-.06-1.59-.07-4.74-.07Zm0 3.38a4.44 4.44 0 1 1 0 8.88 4.44 4.44 0 0 1 0-8.88Zm0 1.98a2.46 2.46 0 1 0 0 4.92 2.46 2.46 0 0 0 0-4.92Zm4.62-2.16a1.04 1.04 0 1 1 0 2.08 1.04 1.04 0 0 1 0-2.08Z"/></svg>

        <div class="developer-footer">
            <span class="dev-signature">A</span>
            <span>المطور عدنان</span>
            <img src="https://api.iconify.design/fa6-solid:laptop-code.svg?color=%2394a3b8" alt="Developer Icon">

    </div>

    <script>
        // إخفاء الغباش بسلاسة بعد التحميل
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader-wrapper');
                loader.classList.add('hidden');
            }, 600);
        });

        // تأثير النجوم الواقعية المتساقطة
        window.addEventListener('DOMContentLoaded', () => {
            const starsCount = 30;
            for (let i = 0; i < starsCount; i++) {
                let star = document.createElement('div');
                star.classList.add('star');
                
                star.style.left = Math.random() * window.innerWidth + 'px';
                star.style.top = (Math.random() * -100) - 20 + 'px';
                
                let size = Math.random() * 12 + 6;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                
                star.style.backgroundImage = "url(\"data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 0C12 6.627 17.373 12 24 12C17.373 12 12 17.373 12 24C12 17.373 6.627 12 0 12C6.627 12 12 6.627 12 0Z' fill='white'/%3E%3C/svg%3E\")";
                star.style.backgroundSize = "contain";
                star.style.backgroundRepeat = "no-repeat";
                
                star.style.filter = "drop-shadow(0 0 3px #ffffff) drop-shadow(0 0 8px #dc2626)";

                star.style.animationDuration = (5 + Math.random() * 7) + 's';
                star.style.animationDelay = (Math.random() * 6) + 's';
                
                document.body.appendChild(star);
            }
        });

        // تشغيل الصوت العصري عند الكبس
        document.querySelectorAll('.link-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const clickSound = document.getElementById('click-sound');
                clickSound.currentTime = 0;
                clickSound.volume = 0.5;
                clickSound.play().catch(e => console.log("الصوت محظور"));
            });
        });
    </script>

</html>
